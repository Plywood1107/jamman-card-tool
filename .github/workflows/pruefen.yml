# Prüft jede Änderung: Linter und Selbsttest (mit virtuellem Bildschirm).
# Angelegt am 19.11.2026, damit ein Blick auf die Repository-Seite genügt:
# grüner Haken heißt „Fenster baut sich, Knöpfe tun etwas, Texte vollständig".
name: prüfen

on:
  push:
  pull_request:

jobs:
  linter:
    name: Linter (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff
        run: |
          python -m pip install --quiet ruff
          python -m ruff check .jamman/jamman.py .jamman/greenglass.py

  selbsttest:
    name: Selbsttest (Tk unter xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tk und virtueller Bildschirm
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Selbsttest in fünf Sprachen
        run: |
          xvfb-run -a python3 .jamman/jamman.py funktionstest --alle-sprachen
      - name: Protokoll bei Befund mitgeben
        if: failure()
        run: cat .jamman/jamman-fehler.log || true
